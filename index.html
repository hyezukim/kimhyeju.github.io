<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>kimhyeju</title>

  <!-- Pretendard -->
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  >

  <style>

    /* =========================
       BASIC
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "Pretendard", sans-serif;
      background: #fff;
      color: #000;
      overflow: hidden;
    }


    /* =========================
       INFO BUTTON
    ========================= */

    .info-button {
      position: fixed;
      top: 16px;
      right: 16px;

      width: 24px;
      height: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #ccc;
      background: #fff;

      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1;

      cursor: pointer;

      z-index: 1000;
    }

    .info-button:hover {
      background: #f5f5f5;
    }


    /* =========================
       MAIN LAYOUT
    ========================= */

    .main {
      width: 100%;
      height: 100vh;

      display: grid;
      grid-template-columns: 50% 50%;
    }


    /* =========================
       LEFT PROJECT LIST
    ========================= */

    .project-list {
      width: 100%;
      height: 100vh;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 24px;
    }

    /* 스크롤바 숨기기 */

    .project-list::-webkit-scrollbar {
      display: none;
    }

    .project-list {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }


    .project-item {
      width: 100%;

      display: grid;
      grid-template-columns: 50px 1fr 70px;

      align-items: start;

      padding: 8px 0;

      border-bottom: 0;

      cursor: pointer;

      font-size: 15px;
      line-height: 1.35;

      transition: opacity 0.2s ease;
    }

    .project-item:hover {
      opacity: 0.5;
    }


    .project-number {
      font-size: 15px;
    }


    .project-name {
      font-size: 15px;
    }


    .project-year {
      text-align: right;
      font-size: 15px;
    }


    /* =========================
       RIGHT PROJECT VIEWER
    ========================= */

    .project-viewer {
      position: relative;

      width: 100%;
      height: 100vh;

      background: #fff;

      overflow-y: auto;
      overflow-x: hidden;

      display: none;
    }

    .project-viewer.active {
      display: block;
    }


    /* 스크롤바 숨기기 */

    .project-viewer::-webkit-scrollbar {
      display: none;
    }

    .project-viewer {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }


    /* =========================
       CLOSE BUTTON
    ========================= */

    .close-button {
      position: fixed;

      top: 16px;
      right: calc(50% + 16px);

      width: 24px;
      height: 24px;

      display: none;

      align-items: center;
      justify-content: center;

      border: 1px solid #ccc;
      background: #fff;

      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1;

      cursor: pointer;

      z-index: 900;
    }

    .project-viewer.active + .close-button {
      display: flex;
    }


    /* =========================
       PROJECT CONTENT
    ========================= */

    .project-content {
      width: 100%;
      min-height: 100%;

      padding: 70px 40px 80px;
    }


    .project-header {
      margin-bottom: 50px;
    }


    .project-title {
      margin: 0 0 4px;

      font-size: 18px;
      font-weight: 500;
      line-height: 1.3;
    }


    .project-description {
      margin: 0;

      font-size: 15px;
      line-height: 1.5;
    }


    /* =========================
       PROJECT IMAGES
    ========================= */

    .project-images {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 50px;
    }


    .project-images img {
      display: block;

      width: 100%;
      height: auto;

      object-fit: contain;
    }


    /* =========================
       INFO POPUP
    ========================= */

    .info-overlay {
      position: fixed;

      inset: 0;

      display: none;

      align-items: flex-start;
      justify-content: flex-end;

      background: rgba(255, 255, 255, 0.45);

      z-index: 2000;
    }

    .info-overlay.active {
      display: flex;
    }


    .info-popup {
      width: 50%;
      min-height: 100vh;

      padding: 24px;

      background: #fff;

      border-left: 1px solid #ddd;

      font-size: 14px;
      line-height: 1.4;
    }


    .info-popup-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      margin-bottom: 30px;
    }


    .info-popup-name {
      margin: 0;

      font-size: 16px;
      font-weight: 500;
    }


    .info-close {
      font-size: 13px;

      cursor: pointer;

      text-decoration: none;
    }


    .info-section {
      margin-bottom: 40px;
    }


    .info-section-title {
      margin-bottom: 18px;

      color: #aaa;

      font-size: 13px;
      font-weight: 400;
    }


    .info-section p {
      margin: 0 0 20px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {

      body {
        overflow: auto;
      }


      .main {
        display: block;

        height: auto;
        min-height: 100vh;
      }


      .project-list {
        width: 100%;
        height: auto;
        min-height: 100vh;

        padding: 20px;
      }


      .project-item {
        grid-template-columns: 40px 1fr 55px;

        padding: 8px 0;

        font-size: 14px;
      }


      .project-number,
      .project-name,
      .project-year {
        font-size: 14px;
      }


      .project-viewer {
        position: fixed;

        inset: 0;

        width: 100%;
        height: 100vh;

        z-index: 1500;
      }


      .project-content {
        padding: 60px 20px 50px;
      }


      .project-header {
        margin-bottom: 30px;
      }


      .project-title {
        font-size: 17px;
      }


      .project-description {
        font-size: 14px;
      }


      .project-images {
        gap: 30px;
      }


      .close-button {
        position: fixed;

        top: 16px;
        right: 16px;

        z-index: 1800;
      }


      .info-button {
        top: 16px;
        right: 16px;
      }


      .info-popup {
        width: 100%;
        min-height: 100vh;

        padding: 20px;

        border-left: none;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       INFO BUTTON
  ========================== -->

  <button
    class="info-button"
    id="infoButton"
    type="button"
  >
    i
  </button>



  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">


    <!-- =========================
         LEFT : PROJECT LIST
    ========================== -->

    <section class="project-list">


      <!-- PROJECT 01 -->

      <div
        class="project-item"
        data-project="1"
      >

        <div class="project-number">
          01
        </div>

        <div class="project-name">
          Graduation Project<br>
          흔적에서 현상으로
        </div>

        <div class="project-year">
          2023
        </div>

      </div>



      <!-- PROJECT 02 -->

      <div
        class="project-item"
        data-project="2"
      >

        <div class="project-number">
          02
        </div>

        <div class="project-name">
          Academic Project<br>
          Kim Library
        </div>

        <div class="project-year">
          2022
        </div>

      </div>


    </section>



    <!-- =========================
         RIGHT : PROJECT VIEWER
    ========================== -->

    <section
      class="project-viewer"
      id="projectViewer"
    >

      <div class="project-content">


        <div class="project-header">

          <h1
            class="project-title"
            id="projectTitle"
          ></h1>

          <p
            class="project-description"
            id="projectDescription"
          ></p>

        </div>


        <div
          class="project-images"
          id="projectImages"
        ></div>


      </div>

    </section>



    <!-- CLOSE BUTTON -->

    <button
      class="close-button"
      id="closeButton"
      type="button"
    >
      ×
    </button>


  </main>



  <!-- =========================
       INFO POPUP
  ========================== -->

  <div
    class="info-overlay"
    id="infoOverlay"
  >

    <div class="info-popup">


      <div class="info-popup-header">

        <h2 class="info-popup-name">
          Kim Hyeju
        </h2>

        <span
          class="info-close"
          id="infoClose"
        >
          (close)
        </span>

      </div>




      <!-- PROFESSION -->

      <div class="info-section">

        <div class="info-section-title">
          profession
        </div>

        <p>
          Architecture<br>
          Seoul, KR
        </p>


        <p>
          Min Workshop<br>
          Architectural Designer (2023- )
        </p>

      </div>



      <!-- CONTACT -->

      <div class="info-section">

        <div class="info-section-title">
          contact
        </div>

        <p>
          kimhyeju.com
        </p>

          <p>
          hyezukim@gmail.com
        </p>

      </div>


    </div>

  </div>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /* =========================
       PROJECT DATA
    ========================== */

    const projects = {

      1: {
        title: "Graduation Project",
        description: "흔적에서 현상으로 / 2023",
        images: [
          "images/project1-1.jpg",
          "images/project1-2.jpg"
        ]
      },

      2: {
        title: "Academic Project",
        description: "Kim Library / 2022",
        images: [
          "images/project2-1.jpg",
          "images/project2-2.jpg",
          "images/project2-3.jpg"
        ]
      }

    };



    /* =========================
       ELEMENTS
    ========================== */

    const projectItems =
      document.querySelectorAll(".project-item");

    const projectViewer =
      document.getElementById("projectViewer");

    const projectTitle =
      document.getElementById("projectTitle");

    const projectDescription =
      document.getElementById("projectDescription");

    const projectImages =
      document.getElementById("projectImages");

    const closeButton =
      document.getElementById("closeButton");



    /* =========================
       OPEN PROJECT
    ========================== */

    function openProject(projectNumber) {

      const project =
        projects[projectNumber];

      if (!project) {
        return;
      }


      projectTitle.textContent =
        project.title;


      projectDescription.textContent =
        project.description;


      projectImages.innerHTML = "";


      project.images.forEach(function(imagePath) {

        const image =
          document.createElement("img");

        image.src = imagePath;

        image.alt = project.title;

        projectImages.appendChild(image);

      });


      projectViewer.classList.add("active");


      projectViewer.scrollTop = 0;

    }



    /* =========================
       CLOSE PROJECT
    ========================== */

    function closeProject() {

      projectViewer.classList.remove("active");

      projectImages.innerHTML = "";

      projectViewer.scrollTop = 0;

    }



    /* =========================
       PROJECT CLICK
    ========================== */

    projectItems.forEach(function(item) {

      item.addEventListener("click", function() {

        const projectNumber =
          this.dataset.project;

        openProject(projectNumber);

      });

    });



    /* =========================
       CLOSE BUTTON
    ========================== */

    closeButton.addEventListener(
      "click",
      closeProject
    );



    /* =========================
       INFO POPUP
    ========================== */

    const infoButton =
      document.getElementById("infoButton");

    const infoOverlay =
      document.getElementById("infoOverlay");

    const infoClose =
      document.getElementById("infoClose");



    infoButton.addEventListener(
      "click",
      function() {

        infoOverlay.classList.add("active");

      }
    );



    infoClose.addEventListener(
      "click",
      function() {

        infoOverlay.classList.remove("active");

      }
    );



    /* =========================
       CLICK OUTSIDE INFO POPUP
    ========================== */

    infoOverlay.addEventListener(
      "click",
      function(event) {

        if (
          event.target === infoOverlay
        ) {

          infoOverlay.classList.remove("active");

        }

      }
    );



    /* =========================
       ESC KEY
    ========================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeProject();

          infoOverlay.classList.remove("active");

        }

      }
    );

  </script>


</body>
</html>
