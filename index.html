  <template id="project1Template">
    <section class="project-overview reveal">
      <dl class="project-meta">
        <div><dt>Year</dt><dd>2023</dd></div>
        <div><dt>Location</dt><dd>Jongno-gu, Seoul</dd></div>
        <div><dt>Program</dt><dd>Cultural, Public</dd></div>
        <div><dt>Type</dt><dd>Individual Work</dd></div>
      </dl>

      <div class="project-intro">
        <p>
          사람들은 익숙한 것에는 그다지 관심을 두지 않는다. 일상 속 건축 역시 익숙하다는 이유로 인식되지 못한 채 지나치기 쉽다. 이 프로젝트는 그렇게 무의식 속에 남은 건축을 다시 바라보는 데서 시작했다.
        </p>
        <p>
          건축의 기능적 속성에서 벗어나기 위한 ‘낯설게 하기’를 제안하고, 도시에서 단절된 창신동 절개지를 새로운 현상이 일어나는 장소로 전환한다.
        </p>
      </div>
    </section>

    <figure class="project-media project-media--hero reveal">
      <img src="images/projects/project-01/site-view.webp" width="2154" height="1523" alt="창신동 절개지와 제안 건축물의 전경" loading="eager" decoding="async">
      <figcaption>Changsin-dong cliff and proposed architecture</figcaption>
    </figure>

    <section class="project-story reveal">
      <div class="story-heading">
        <span>01</span>
        <h2>낯설게 하기</h2>
      </div>
      <div class="story-copy">
        <p>
          서울의 중심에 위치한 창신동 절개지는 도시의 살아 있는 기록이자 이면적 장소이며, 현재는 절벽이라는 특수한 오브제로 남아 있다. 역사가 축적된 이 땅의 의미를 되짚고, 과거 도시의 전환점이었던 장소에 또 다른 가능성을 제시한다.
        </p>
        <p>
          채석장에서 비롯된 재료의 구축 논리와 시간의 흐름을 따라 단절된 땅에 현재의 것을 덧붙인다. 고착된 땅을 다시 바라보게 함으로써 장소의 의미와 도시의 낯선 풍경을 드러낸다.
        </p>
      </div>
    </section>

    <div class="project-grid project-grid--two reveal">
      <figure class="project-media">
        <img src="images/projects/project-01/site-plan.webp" width="1230" height="971" alt="창신동 절개지 배치도" loading="lazy" decoding="async">
        <figcaption>Site plan</figcaption>
      </figure>
      <figure class="project-media">
        <img src="images/projects/project-01/site-section.webp" width="2151" height="1521" alt="절개지와 건축물의 대지 단면" loading="lazy" decoding="async">
        <figcaption>Site section</figcaption>

    <section class="project-story reveal">

        <h2>흔적에서 현상으로</h2>
      </div>
      <div class="story-copy">
        <p>
          창신동은 100년의 시간 동안 존재와 소멸, 변질의 과정이 시각적으로 드러난 장소다. 시간의 흔적에 집중해 보이지 않는 장소의 궤적을 보이는 현상으로 되돌린다.
        </p>
        <p>
          건축물의 모든 이동은 램프를 통해 이뤄진다. 외부에서 내부로, 수평의 땅에서 수직의 절벽으로 이어지는 이동은 대지와 건축의 경계를 흐리며 서로를 연결한다.

  <template id="project2Template">
    <section class="project-overview reveal">
      <dl class="project-meta">
        <div><dt>Year</dt><dd>2022</dd></div>

        <blockquote>
          “정확하게 표현되지 못한 진실은 아프다고 말하지 못하지만, 정확하게 사랑받지 못하는 사람은 고통을 느낀다.”
        </blockquote>
        <p>
          한국에 뿌리를 둔 설계자로서 애정과 존경을 담아 자연스럽게 익혀 온 한국성을 찾는다. 관찰과 실험은 오늘의 한국성을 정확히 바라보기 위한 과정이다.
        </p>
      </div>
    </section>

    <figure class="project-media project-media--hero reveal">
      <img src="images/projects/project-02/front-view.webp" width="875" height="512" alt="부암동 경사지에 자리한 주택의 정면" loading="eager" decoding="async">

    <section class="project-story reveal">
      <div class="story-heading">
        <span>01</span>
        <h2>관찰</h2>
      </div>
      <div class="story-copy">
        <p>
          도시의 배경이 변하면서 주거의 형상도 도시한옥에서 불란서주택, 다가구주택과 아파트, 원룸으로 변해 왔다. 이 주거 유형이 모여 만든 군집의 풍경은 각 시대의 성격을 반영한다.
        </p>
        <p>
          지금까지 변화한 집의 형상을 한 필지에 모으면 어떤 모습이 될까. 학습하고 경험한 주거의 풍경을 시대의 거울로 삼아 현재의 한국성으로 다시 구성한다.
        </p>

        <h2>실험</h2>
      </div>

          대상지는 인왕산과 북악산 사이의 경사지에 있다. 정돈되지 않은 길과 남아 있는 집터가 만드는 군집의 풍경에는 삶의 지형학이 축적돼 있다.
        </p>
        <p>
          석축과 외부계단, 원룸·다가구주택·도시한옥·아파트를 재해석한 네 개의 덩어리를 조합한다. 서로 적절히 떨어진 공간을 직접 걸어 이동하도록 해 반기능적인 구성이 오히려 더 기능적인 삶을 만들게 한다.
        </p>
      </div>
    </section>

        <h2>결과</h2>
      </div>
      <div class="story-copy">
        <p>
          우리가 살아가는 풍경은 오랜 시간 속에서 옛것과 현재의 것이 함께 쌓여 만들어진다. 각 시대를 반영한 한국성이 모여 지금의 풍경을 만들고, 우리는 그 풍경을 기억한다.
        </p>
        <p>
          경험한 한국성을 정확하게 기억하고 표현하며 오늘의 한국성을 드러낸다. 전통을 현대의 눈으로 바라보고 새롭게 창조해, 다음 세대가 받아들일 수 있는 유산을 만든다.
        </p>

  <template id="project3Template">
    <section class="project-overview reveal">
      <dl class="project-meta">
        <div><dt>Year</dt><dd>2022</dd></div>
        <div><dt>Location</dt><dd>Anyang-si, Gyeonggi-do</dd></div>
        <div><dt>Program</dt><dd>Cultural, Public</dd></div>
        <div><dt>Type</dt><dd>Individual Work</dd></div>
      </dl>

      <div class="project-intro">
        <p>
          1960년대 산업시설인 옛 유유산업 안양공장은 문화공간으로 전환돼 김중업건축박물관으로 사용되고 있다. 시대의 요구에 따라 보존되고 확장되며 변형되는 김중업의 건축은 끊임없이 변화하는 유기체다.
        </p>
        <p>
          김중업 탄생 100주년을 맞아 대지 위에 새로운 레이어가 될 도서관을 제안한다. 오늘날 그의 건축 유산이 어떻게 수명을 이어가고 활용될 수 있는지 질문한다.
        </p>
      </div>
    </section>

    <figure class="project-media project-media--hero project-media--dark reveal">
      <img src="images/projects/project-03/study-model.webp" width="874" height="1233" alt="김중업 건축박물관과 도서관의 적층 모형" loading="eager" decoding="async">

    </figure>

    <section class="project-story reveal">
      <div class="story-heading">
        <span>01</span>
        <h2>병치와 증식</h2>
      </div>
      <div class="story-copy">
        <p>
          기하학적 단순성을 가지면서 기능에 따라 계속 분화하는 김중업의 건축 언어를 도서관 프로그램으로 표현한다. 건축을 하나의 유형학적 텍스트로 보고, 독립된 요소를 병치해 새로운 전체를 만든다.
        </p>
        <p>
          각 요소가 자율성을 갖도록 트러스가 지지하는 대공간 안에 자유로운 볼륨을 배치한다. 공간을 조금씩 엇갈리게 두어 얕은 시선과 깊은 시선이 충돌하도록 하고, 각 기능의 독립적인 동선을 유지한다.
        </p>
      </div>
    </section>

  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /* =========================
       PROJECT DATA
    ========================== */

    const projects = {

      1: {
        title: "Graduation Project",
        description: "흔적에서 현상으로 / 2023",
        templateId: "project1Template"
      },

      2: {
        title: "Competition Project",
        description: "정확한 한국성의 실험 / 2022",
        templateId: "project2Template"
      },

      3: {
        title: "Academic Project",
        description: "김중업 Memorial 도서관 / 2022",
        templateId: "project3Template"
      }

    };



    /* =========================
       ELEMENTS
    ========================== */

    const projectItems =
      document.querySelectorAll(".project-item");

    const projectViewer =
      document.getElementById("projectViewer");

    const projectTitle =
      document.getElementById("projectTitle");

    const projectDescription =
      document.getElementById("projectDescription");

    const projectArticle =
      document.getElementById("projectArticle");

    const closeButton =
      document.getElementById("closeButton");

    let revealObserver;
    let activeProjectTrigger;
    let previousInfoFocus;



    /* =========================
       OPEN PROJECT
    ========================== */

    function openProject(projectNumber, trigger) {

      const project =
        projects[projectNumber];

      if (!project) {
        return;
      }


      projectTitle.textContent =
        project.title;


      projectDescription.textContent =
        project.description;


      const template =
        document.getElementById(project.templateId);

      projectArticle.replaceChildren(
        template.content.cloneNode(true)
      );


      projectViewer.classList.add("active");
      activeProjectTrigger = trigger;


      projectViewer.scrollTop = 0;

      closeButton.focus();

      window.requestAnimationFrame(function() {
        observeProjectContent();
      });

    }



    function observeProjectContent() {

      if (revealObserver) {
        revealObserver.disconnect();
      }

      const revealItems =
        projectArticle.querySelectorAll(".reveal");

      if (
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        revealItems.forEach(function(item) {
          item.classList.add("is-visible");
        });
        return;
      }

      revealObserver = new IntersectionObserver(
        function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              revealObserver.unobserve(entry.target);
            }
          });
        },
        {
          root: projectViewer,
          rootMargin: "0px 0px -8% 0px",
          threshold: 0.08
        }
      );

      revealItems.forEach(function(item) {
        revealObserver.observe(item);
      });

    }



    /* =========================
       CLOSE PROJECT
    ========================== */

    function closeProject() {

      projectViewer.classList.remove("active");

      projectArticle.innerHTML = "";

      if (revealObserver) {
        revealObserver.disconnect();
      }

      projectViewer.scrollTop = 0;

      if (activeProjectTrigger) {
        activeProjectTrigger.focus();
        activeProjectTrigger = null;
      }

    }



    /* =========================
       PROJECT CLICK
    ========================== */

    projectItems.forEach(function(item) {

      item.addEventListener("click", function() {

        const projectNumber =
          this.dataset.project;

        openProject(projectNumber, this);

      });

    });



    /* =========================
       CLOSE BUTTON
    ========================== */

    closeButton.addEventListener(
      "click",
      closeProject
    );



    /* =========================
       INFO POPUP
    ========================== */

    const infoButton =
      document.getElementById("infoButton");

    const infoOverlay =
      document.getElementById("infoOverlay");

    const infoClose =
      document.getElementById("infoClose");


    function openInfo() {

      previousInfoFocus = document.activeElement;

      infoOverlay.classList.add("active");
      infoOverlay.setAttribute("aria-hidden", "false");
      infoButton.setAttribute("aria-expanded", "true");

      infoClose.focus();

    }


    function closeInfo() {

      infoOverlay.classList.remove("active");
      infoOverlay.setAttribute("aria-hidden", "true");
      infoButton.setAttribute("aria-expanded", "false");

      if (previousInfoFocus) {
        previousInfoFocus.focus();
        previousInfoFocus = null;
      }

    }



    infoButton.addEventListener(
      "click",
      openInfo
    );



    infoClose.addEventListener(
      "click",
      closeInfo
    );



    /* =========================
       CLICK OUTSIDE INFO POPUP
    ========================== */

    infoOverlay.addEventListener(
      "click",
      function(event) {

        if (
          event.target === infoOverlay
        ) {

          closeInfo();

        }

      }
    );


    infoOverlay.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Tab") {
          event.preventDefault();
          infoClose.focus();
        }

      }
    );



    /* =========================
       ESC KEY
    ========================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          if (infoOverlay.classList.contains("active")) {
            closeInfo();
          } else if (projectViewer.classList.contains("active")) {
            closeProject();
          }

        }

      }
    );

  </script>
